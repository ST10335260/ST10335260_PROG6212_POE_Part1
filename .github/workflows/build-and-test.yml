name: Build and Test

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore API and tests
        run: dotnet restore ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2.Tests/ST10335260_PROG6212_POE_Part2.Tests.csproj

      - name: Build API and tests
        run: dotnet build ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2.Tests/ST10335260_PROG6212_POE_Part2.Tests.csproj --no-restore --configuration Release

      - name: Run unit tests
        run: dotnet test ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2.Tests/ST10335260_PROG6212_POE_Part2.Tests.csproj --no-build --configuration Release --verbosity normal

      - name: Restore MVC front end
        run: dotnet restore ST10335260_PROG6212_POE_Part3/ST10335260_PROG6212_POE_Part3.csproj

      - name: Build MVC front end
        run: dotnet build ST10335260_PROG6212_POE_Part3/ST10335260_PROG6212_POE_Part3.csproj --no-restore --configuration Release
