name: Validate Repository Structure

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "/docs folder found"

      - name: Check required planning files exist
        run: |
          required_files=("docs/RaceDay_ERD.png" "docs/RaceDay_Database.sql")
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
            echo "Found: $f"
          done

      - name: Check API endpoint plan exists (md or pdf)
        run: |
          if [ -f "docs/RaceDay_API_Endpoint_Plan.md" ] || [ -f "docs/RaceDay_API_Endpoint_Plan.pdf" ]; then
            echo "API endpoint plan found"
          else
            echo "ERROR: docs/RaceDay_API_Endpoint_Plan.md or .pdf is missing"
            exit 1
          fi

      - name: Check README exists and is not empty
        run: |
          if [ ! -s "README.md" ]; then
            echo "ERROR: README.md is missing or empty"
            exit 1
          fi
          echo "README.md present"

      - name: Check project folders exist
        run: |
          required_dirs=("ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2" "ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2.Tests" "ST10335260_PROG6212_POE_Part3")
          for d in "${required_dirs[@]}"; do
            if [ ! -d "$d" ]; then
              echo "ERROR: Required folder missing: $d"
              exit 1
            fi
            echo "Found: $d"
          done

      - name: Check Docker files exist
        run: |
          required_files=("docker-compose.yml" "ST10335260_PROG6212_POE_Part3/Dockerfile" "ST10335260_PROG6212_POE_Part2/ST10335260_PROG6212_POE_Part2/Dockerfile")
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
            echo "Found: $f"
          done
