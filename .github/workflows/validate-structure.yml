name: Validate Repository Structure

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check /docs folder exists
        run: |
          if [ ! -d "docs" ]; then
            echo "ERROR: /docs folder is missing"
            exit 1
          fi
          echo "/docs folder found"

      - name: Check required planning files exist
        run: |
          required_files=("docs/RaceDay_ERD.png" "docs/RaceDay_Database.sql")
          for f in "${required_files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "ERROR: Required file missing: $f"
              exit 1
            fi
            echo "Found: $f"
          done

      - name: Check API endpoint plan exists (md or pdf)
        run: |
          if [ -f "docs/RaceDay_API_Endpoint_Plan.md" ] || [ -f "docs/RaceDay_API_Endpoint_Plan.pdf" ]; then
            echo "API endpoint plan found"
          else
            echo "ERROR: docs/RaceDay_API_Endpoint_Plan.md or .pdf is missing"
            exit 1
          fi

      - name: Check README exists and is not empty
        run: |
          if [ ! -s "README.md" ]; then
            echo "ERROR: README.md is missing or empty"
            exit 1
          fi
          echo "README.md present"
